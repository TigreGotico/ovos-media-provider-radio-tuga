[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-media-provider-radio-tuga"
dynamic = ["version"]
description = "OVOS MediaProvider plugin for Portuguese radio stations (replaces skill-ovos-radio-tuga)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAI", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.10"
keywords = ["ovos", "OpenVoiceOS", "OCP", "media", "radio", "portugal", "tuga", "MediaProvider"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mediavocab>=1.0.0",
    "ovos-plugin-manager>=2.8.0a1,<3.0.0",
    "ovos-utils>=0.0.38",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/TigreGotico/ovos-media-provider-radio-tuga"
Source = "https://github.com/TigreGotico/ovos-media-provider-radio-tuga"

[project.entry-points."opm.media.provider"]
radio_tuga = "ovos_media_provider_radio_tuga:RadioTugaMediaProvider"

[tool.setuptools]
packages = ["ovos_media_provider_radio_tuga"]
include-package-data = true

[tool.setuptools.package-data]
ovos_media_provider_radio_tuga = ["res/*.json"]

[tool.setuptools.dynamic]
version = { attr = "ovos_media_provider_radio_tuga.version.__version__" }
